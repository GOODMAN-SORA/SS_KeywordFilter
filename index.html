<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>데이터베이스 검색</title>
				<script src="https://cdn.tailwindcss.com"></script>
				<style>
					@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
					body { font-family: 'Noto+Sans+KR', sans-serif; }

					.selected-tag { @apply bg-indigo-600 text-white px-3 py-1 rounded-full text-sm cursor-pointer hover:bg-rose-500 flex items-center gap-1 transition-all shadow-sm; }
					.toggle-btn { @apply w-full text-left px-5 py-4 rounded-xl border border-slate-100 bg-white shadow-sm font-bold flex justify-between items-center transition-all hover:border-indigo-300 active:scale-[0.98]; }
					.toggle-btn.active { @apply border-indigo-500 bg-indigo-50 text-indigo-900 shadow-md ring-2 ring-indigo-200 ring-offset-2; }
					.detail-panel { display: none; }
					.detail-panel.active { display: block; }

					::-webkit-scrollbar { width: 6px; }
					::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

					.related-potentials { @apply mt-2 ml-3 pl-3 border-l-2 border-indigo-200 space-y-2; }

					/* 캐릭터 썸네일 그리드용 스타일 추가 */
					.char-grid {
					display: grid;
					grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
					gap: 5px;
					margin-bottom: 10px;
					}

					.char-card {
					display: flex;
					flex-direction: column;
					align-items: center;
					cursor: pointer;
					transition: transform 0.2s;
					}

					.char-card:hover {
					transform: scale(1.05);
					}

					.char-img-container {
					position: relative;
					width: 75px;
					height: 75px;
					border-radius: 7px;
					overflow: hidden;
					background-color: #f1f5f9;
					box-shadow: 0 4px 6px rgba(0,0,0,0.1);
					border: 2px solid transparent;
					transition: border-color 0.2s;
					}

					.char-card.active .char-img-container {
					border-color: #6366f1; /* 선택 시 테두리 색상 */
					box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
					}

					.char-img {
					width: 100%;
					height: 100%;
					object-fit: cover;
					}

					.element-icon {
					position: absolute;
					top: 4px;
					left: 4px;
					width: 24px;
					height: 24px;
					border-radius: 50%;
					background-color: rgba(0,0,0,0.4); /* 약간의 배경을 주어 아이콘이 잘 보이게 함 */
					padding: 2px;
					}

					.char-name-label {
					margin-top: 8px;
					font-size: 14px;
					font-weight: bold;
					text-align: center;
					color: #334155;
					}
				</style>
			</head>
	<body class="bg-slate-50 text-slate-900 min-h-screen pb-20">

		<div class="container mx-auto px-4 py-10 max-w-5xl">
			<header class="mb-12 text-center">
				<h1 class="text-4xl font-extrabold text-indigo-900 mb-3">🔍 스소 데이터 키워드 필터</h1>
				<p class="text-slate-500 italic">속성 태그는 하나만 선택 가능합니다.</p>
			</header>

			<section class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 mb-10 relative z-20">
				<div class="relative mb-6">
					<input type="text" id="tag-input" placeholder="검색할 태그나 초성을 입력하세요..." autocomplete="off"
						class="w-full px-5 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-lg shadow-inner">
						<ul id="tag-suggestions" class="absolute z-50 w-full bg-white border border-slate-200 rounded-xl mt-2 shadow-2xl max-h-80 overflow-y-auto hidden divide-y divide-slate-50"></ul>
					</div>

				<div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100">
					<div id="selected-tags-container" class="flex flex-wrap gap-2 items-center">
						<span class="text-slate-400 italic text-sm">선택된 태그가 없습니다.</span>
					</div>
					<button onclick="resetFilters()" class="text-sm font-bold text-rose-500 hover:text-rose-700">초기화</button>
				</div>
			</section>

			<!-- PC 환경 기준 좌/우 2단 분할 레이아웃 -->
			<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
				<!-- 좌측: 캐릭터 영역 -->
				<div class="space-y-4">
					<h2 class="text-2xl font-bold text-indigo-900 pb-2 border-b-2 border-indigo-100 flex justify-between">
						<span>👤 캐릭터</span>
						<span id="char-count" class="text-slate-300 font-mono">0</span>
					</h2>
					<!-- 캐릭터 목록 그리드 컨테이너 -->
					<div id="character-grid" class="char-grid"></div>
					<!-- 캐릭터 상세 정보 패널을 담을 곳 -->
					<div id="character-detail-container" class="space-y-3 mt-4"></div>
				</div>

				<!-- 우측: 레코드 영역 -->
				<div class="space-y-4">
					<h2 class="text-2xl font-bold text-emerald-900 pb-2 border-b-2 border-emerald-100 flex justify-between">
						<span>💿 레코드</span>
						<span id="rec-count" class="text-slate-300 font-mono">0</span>
					</h2>
					<div id="record-list" class="space-y-3"></div>
				</div>
			</div>
		</div>

		<script>
			let db = null;
			let allUniqueTags = [];
			let selectedTags = new Set();
			let currentOpenCharId = null; // 현재 열려있는 캐릭터 ID 추적

			const ATTRIBUTE_TAGS = ['물 속성', '불 속성', '땅 속성', '바람 속성', '빛 속성', '어둠 속성', '무 속성'];

			// 원소 태그 이름과 EET 번호 매핑 (이미지 경로용)
			const ELEMENT_TAG_TO_EET = {
			'물 속성': 1, '불 속성': 2, '땅 속성': 3, '바람 속성': 4,
			'빛 속성': 5, '어둠 속성': 6, '무 속성': 7
			};

			async function init() {
			try {
			const res = await fetch('FilteredDB.json', { cache: 'no-cache' });
			db = await res.json();

			const tagSet = new Set();
			Object.values(db.Characters || {}).forEach(c => {
			Object.values(c.skills || {}).forEach(s => {
			(s.tags || []).forEach(t => tagSet.add(t));
			(s.related_potentials || []).forEach(rp => (rp.tags || []).forEach(t => tagSet.add(t)));
			});
			Object.values(c.potentials || {}).forEach(p => (p.tags || []).forEach(t => tagSet.add(t)));
			});
			Object.values(db.Records || {}).forEach(r => {
			(r.main_skill || []).forEach(t => tagSet.add(t));
			Object.values(r.sub_skills || {}).forEach(item => (item.tags || []).forEach(t => tagSet.add(t)));
			});
			allUniqueTags = Array.from(tagSet).sort((a, b) => a.localeCompare(b, 'ko'));

			setupSearch();
			filterAndRender();
			} catch(e) { console.error("데이터 로드 실패:", e); }
			}

			function makeChosungRegex(query) {
			const CHOSUNG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
			const START = 44032;
			let pattern = '';
			for (let char of query) {
			if (char === ' ') { pattern += '\\s*'; continue; }
			let idx = CHOSUNG.indexOf(char);
			if (idx > -1) {
			let b = START + (idx * 588);
			pattern += `[${char}\\u${b.toString(16).padStart(4,'0')}-\\u${(b+587).toString(16).padStart(4,'0')}]`;
			} else pattern += char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
			pattern += '\\s*';
			}
			return new RegExp(pattern, 'i');
			}

			function setupSearch() {
			const input = document.getElementById('tag-input');
			const box = document.getElementById('tag-suggestions');

			const updateSuggestions = (q) => {
			const val = q.trim();
			const filtered = val ? allUniqueTags.filter(t => !selectedTags.has(t) && makeChosungRegex(val).test(t)) : allUniqueTags.filter(t => !selectedTags.has(t));
			box.innerHTML = filtered.map(t => `<li class="px-5 py-3 hover:bg-indigo-50 cursor-pointer" onmousedown="addTag('${t}')">${t}</li>`).join('');
			box.classList.toggle('hidden', filtered.length === 0);
			};

			input.onfocus = () => updateSuggestions(input.value);
			input.oninput = (e) => updateSuggestions(e.target.value);
			document.addEventListener('mousedown', (e) => {
			if(!e.target.closest('#tag-input') && !e.target.closest('#tag-suggestions')) box.classList.add('hidden');
			});
			}

			function addTag(tag) {
			if (ATTRIBUTE_TAGS.includes(tag)) {
			ATTRIBUTE_TAGS.forEach(attr => selectedTags.delete(attr));
			}

			selectedTags.add(tag);
			document.getElementById('tag-input').value = '';
			renderSelectedTags();
			filterAndRender();
			}

			function removeTag(tag) {
			selectedTags.delete(tag);
			renderSelectedTags();
			filterAndRender();
			}

			function renderSelectedTags() {
			const container = document.getElementById('selected-tags-container');
			container.innerHTML = Array.from(selectedTags).map(t => `<span class="selected-tag" onclick="removeTag('${t}')">${t} &times;</span>`).join('') || '<span class="text-slate-400 italic text-sm">선택된 태그가 없습니다.</span>';
			}

			function resetFilters() {
			selectedTags.clear();
			currentOpenCharId = null; // 필터 초기화 시 열린 창 리셋
			renderSelectedTags();
			filterAndRender();
			}

			// 캐릭터의 원소 속성 번호를 찾는 헬퍼 함수
			function getCharElementEET(charData) {
			let elementTag = null;
			// 스킬이나 잠재력 태그에서 속성 태그 찾기
			const allCharTags = new Set();
			Object.values(charData.skills || {}).forEach(s => (s.tags || []).forEach(t => allCharTags.add(t)));
			Object.values(charData.potentials || {}).forEach(p => (p.tags || []).forEach(t => allCharTags.add(t)));

			for (let tag of ATTRIBUTE_TAGS) {
			if (allCharTags.has(tag)) {
			elementTag = tag;
			break;
			}
			}
			return elementTag ? ELEMENT_TAG_TO_EET[elementTag] : null;
			}

			// 캐릭터 썸네일 클릭 시 하단에 상세 정보 렌더링
			function toggleCharDetail(charId, charDataStr, matchesStr) {
			const charData = JSON.parse(decodeURIComponent(charDataStr));
			const matches = JSON.parse(decodeURIComponent(matchesStr));

			const detailContainer = document.getElementById('character-detail-container');
			document.querySelectorAll('.char-card').forEach(el => el.classList.remove('active'));

			if (currentOpenCharId === charId) {
			detailContainer.innerHTML = '';
			currentOpenCharId = null;
			return;
			}

			const cardEl = document.getElementById(`char-card-${charId}`);
			if (cardEl) cardEl.classList.add('active');
			currentOpenCharId = charId;

			let panelContent = `
			<div class="bg-white p-5 border border-indigo-200 rounded-xl shadow-lg mt-2">
				<div class="flex items-center gap-4 mb-4 pb-3 border-b border-slate-100">
					<img src="Img/Char/Icon/${charId}.png" onerror="this.src='https://via.placeholder.com/64?text=No+Img'" class="w-14 h-14 rounded-lg object-cover shadow-sm">
						<h3 class="text-lg font-extrabold text-slate-800">${charData.Name}</h3>
					</div>
				`;

				let skillsContent = '';
				let potentialsContent = '';

				matches.forEach(m => {
				if(m.type === '스킬') {
				skillsContent += `
				<div class="p-3 bg-indigo-50/50 rounded-lg text-sm border border-indigo-50 mb-3">
					<div class="mb-2">
						<span class="bg-indigo-500 text-white text-[10px] px-1.5 py-0.5 rounded font-bold mr-1">스킬</span>
						<strong class="text-indigo-900">${m.Name}</strong>
					</div>
					<div class="flex flex-wrap gap-1 mb-2">
						${(m.tags||[]).map(t => `<span class="bg-white border border-indigo-100 px-1.5 py-0.5 rounded text-[11px] font-medium text-slate-600">${t}</span>`).join('')}
					</div>`;

					if (m.data && m.data.related_potentials && m.data.related_potentials.length > 0) {
					skillsContent += `<div class="related-potentials">
						<div class="text-[11px] font-bold text-slate-400 mb-1">연관 잠재력</div>`;
						m.data.related_potentials.forEach(pot => {
						skillsContent += `
						<div class="p-2 bg-white/60 rounded text-xs border border-indigo-100/50">
							<div class="mb-1 text-slate-700">
								↳ <strong>${pot.Name}</strong>
							</div>
							<div class="flex flex-wrap gap-1">
								${(pot.tags||[]).map(t => `<span class="bg-indigo-50/50 border border-indigo-50 px-1 rounded text-[10px] text-slate-500">${t}</span>`).join('')}
							</div>
						</div>`;
						});
						skillsContent += `
					</div>`;
					}
					skillsContent += `
				</div>`;
				} else if (m.type === '잠재력') {
				potentialsContent += `
				<div class="p-3 bg-slate-50 rounded-lg text-sm border border-slate-100 mb-2">
					<div class="mb-1">
						<span class="bg-slate-400 text-white text-[10px] px-1.5 py-0.5 rounded font-bold mr-1">공통 잠재력</span>
						<strong class="text-slate-800">${m.Name}</strong>
					</div>
					<div class="flex flex-wrap gap-1">
						${(m.tags||[]).map(t => `<span class="bg-white border border-slate-200 px-1.5 py-0.5 rounded text-[11px] font-medium text-slate-500">${t}</span>`).join('')}
					</div>
				</div>`;
				}
				});

				if(skillsContent) panelContent += `<div class="mb-3">${skillsContent}</div>`;
				if(potentialsContent) panelContent += `<div>${potentialsContent}</div>`;

				panelContent += `
			</div>`;
			detailContainer.innerHTML = panelContent;
			}

			function filterAndRender() {
			if(!db) return;
			const selectedArr = Array.from(selectedTags);
			const charGrid = document.getElementById('character-grid');
			const charDetailContainer = document.getElementById('character-detail-container');
			const recContainer = document.getElementById('record-list');

			let charHtml = '', charCount = 0;
			// 필터링될 때마다 상세 패널 닫기
			charDetailContainer.innerHTML = '';
			currentOpenCharId = null;

			Object.entries(db.Characters || {}).forEach(([id, data]) => {
			let matches = [];

			Object.values(data.skills || {}).forEach(s => {
			if(selectedArr.length === 0 || selectedArr.every(t => (s.tags||[]).includes(t))) {
			matches.push({type:'스킬', Name:s.Name, tags:s.tags, data: s});
			}
			});
			Object.values(data.potentials || {}).forEach(p => {
			if(selectedArr.length === 0 || selectedArr.every(t => (p.tags||[]).includes(t))) {
			matches.push({type:'잠재력', Name:p.Name, tags:p.tags, data: p});
			}
			});

			if(matches.length > 0 || selectedTags.size === 0) {
			charCount++;

			// 원소 아이콘 번호 가져오기
			const eetNum = getCharElementEET(data);
			const elementIconHtml = eetNum ? `<img src="Img/EET/${eetNum}.png" class="element-icon" onerror="this.style.display='none'">
				` : '';

				// 데이터 파싱 에러 방지
				const dataStr = encodeURIComponent(JSON.stringify(data));
				const matchesStr = encodeURIComponent(JSON.stringify(matches));

				charHtml += `
				<div id="char-card-${id}" class="char-card" onclick="toggleCharDetail('${id}', '${dataStr}', '${matchesStr}')">
					<div class="char-img-container">
						${elementIconHtml}
						<img src="Img/Char/Icon/${id}.png" alt="${data.Name}" class="char-img" onerror="this.src='https://via.placeholder.com/80?text=No+Img'">
							</div>
					<div class="char-name-label">${data.Name}</div>
				</div>`;
				}
				});

				let recHtml = '', recCount = 0;
				Object.entries(db.Records || {}).forEach(([id, data]) => {
				let matches = [];
				if(data.main_skill && (selectedArr.length === 0 || selectedArr.every(t => data.main_skill.includes(t)))) {
				matches.push({Name: '메인 스킬', tags: data.main_skill});
				}
				Object.entries(data.sub_skills || {}).forEach(([idx, item]) => {
				if(selectedArr.length === 0 || selectedArr.every(t => (item.tags||[]).includes(t))) {
				matches.push({Name: `보조 스킬 ${idx}`, tags: item.tags});
				}
				});

				if(matches.length > 0 || selectedTags.size === 0) {
				recCount++;
				recHtml += `
				<div class="rec-item">
					<button class="toggle-btn" onclick="toggleDetail(this)">
						<span>${data.Name}</span>
					</button>
					<div class="detail-panel bg-white p-4 border-x border-b border-slate-100 rounded-b-xl space-y-2 mt-[-5px]">
						${matches.map(m => `
						<div class="p-3 bg-emerald-50/50 rounded-lg text-sm border border-emerald-50">
							<div class="mb-1 font-bold text-emerald-800">${m.Name}</div>
							<div class="flex flex-wrap gap-1">
								${(m.tags||[]).map(t => `<span class="bg-white border border-emerald-100 px-1.5 py-0.5 rounded text-[11px] text-emerald-700">${t}</span>`).join('')}
							</div>
						</div>`).join('')}
					</div>
				</div>`;
				}
				});

				charGrid.innerHTML = charHtml;
				recContainer.innerHTML = recHtml;
				document.getElementById('char-count').innerText = charCount;
				document.getElementById('rec-count').innerText = recCount;
				}

				function toggleDetail(btn) {
				btn.classList.toggle('active');
				btn.nextElementSibling.classList.toggle('active');
				}

				init();
			</script>
	</body>
</html>
