<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>스소 키워드 필터 (v3)</title>
				<script src="https://cdn.tailwindcss.com"></script>
				<style>
					@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap');
					body { font-family: 'Noto+Sans+KR', sans-serif; }
					.selected-tag { @apply bg-indigo-600 text-white px-3 py-1 rounded-full text-sm cursor-pointer hover:bg-rose-500 flex items-center gap-1 transition-all shadow-sm; }
					.toggle-btn { @apply w-full text-left px-5 py-4 rounded-xl border border-slate-100 bg-white shadow-sm font-bold flex justify-between items-center transition-all hover:border-indigo-300 active:scale-[0.98]; }
					.toggle-btn.active { @apply border-indigo-500 bg-indigo-50 text-indigo-900 shadow-md ring-2 ring-indigo-200 ring-offset-2; }
					.detail-panel { display: none; }
					.detail-panel.active { display: block; }

					/* 스크롤바 예쁘게 깎기 */
					::-webkit-scrollbar { width: 6px; }
					::-webkit-scrollbar-track { background: transparent; }
					::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
					::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
				</style>
			</head>
	<body class="bg-slate-50 text-slate-900 min-h-screen pb-20">

		<div class="container mx-auto px-4 py-10 max-w-5xl">
			<header class="mb-12 text-center">
				<h1 class="text-4xl font-extrabold text-indigo-900 mb-3">🔍 스소 데이터 키워드 필터</h1>
				<p class="text-slate-500">초성 검색 지원 (예: 'ㅂㅅ' ➡ '불 속성')</p>
			</header>

			<section class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 mb-10 relative z-20">
				<div class="relative mb-6">
					<label class="block text-sm font-bold text-slate-700 mb-2">태그 검색 (클릭 시 전체 목록 표시)</label>
					<div class="relative">
						<input type="text" id="tag-input" placeholder="검색할 태그나 초성을 입력하세요..."
							autocomplete="off"
							class="w-full px-5 py-3 pr-10 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-lg shadow-inner">
							<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
								<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
									<path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
								</svg>
							</div>
						</div>

					<ul id="tag-suggestions" class="absolute z-50 w-full bg-white border border-slate-200 rounded-xl mt-2 shadow-2xl max-h-80 overflow-y-auto hidden divide-y divide-slate-50">
					</ul>
				</div>

				<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100">
					<div id="selected-tags-container" class="flex flex-wrap gap-2 items-center">
						<span class="text-slate-400 italic text-sm">선택된 태그가 없습니다.</span>
					</div>
					<button onclick="resetFilters()" class="text-sm font-bold text-rose-500 hover:text-rose-700 shrink-0 flex items-center gap-1 transition-colors">
						<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
							<path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
						</svg>
						초기화
					</button>
				</div>
			</section>

			<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start relative z-10">

				<div class="space-y-4">
					<h2 class="text-2xl font-bold text-indigo-900 pb-2 border-b-2 border-indigo-100 flex justify-between items-end">
						<span>👤 캐릭터</span>
						<span class="text-sm font-normal text-indigo-600 bg-indigo-50 px-2 py-1 rounded">
							<span id="char-count" class="font-bold">0</span>명 매칭됨
						</span>
					</h2>
					<div id="character-list" class="space-y-3"></div>
				</div>

				<div class="space-y-4">
					<h2 class="text-2xl font-bold text-emerald-900 pb-2 border-b-2 border-emerald-100 flex justify-between items-end">
						<span>💿 레코드</span>
						<span class="text-sm font-normal text-emerald-600 bg-emerald-50 px-2 py-1 rounded">
							<span id="rec-count" class="font-bold">0</span>개 매칭됨
						</span>
					</h2>
					<div id="record-list" class="space-y-3"></div>
				</div>

			</div>
		</div>

		<script>
			let db = null;
			let allUniqueTags = [];
			let selectedTags = new Set();

			// 💡 초성 변환을 위한 정규식 생성기 (핵심 로직)
			function makeChosungRegex(searchQuery) {
			const CHOSUNG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
			const HANGUL_START = 44032; // '가'의 유니코드

			let pattern = '';
			for (let i = 0; i < searchQuery.length; i++) {
                let char = searchQuery[i];
                
                // 띄어쓰기는 무시하거나 유연하게 매칭되도록 처리
                if (char === ' ') {
                    pattern += '\\s*';
                    continue;
                }
                
                let chosungIndex = CHOSUNG.indexOf(char);
                if (chosungIndex > -1) {
                    // 입력된 글자가 초성일 경우: 해당 초성으로 시작하는 모든 글자 범위 계산
                    let begin = HANGUL_START + (chosungIndex * 588);
                    let end = begin + 587;
                    pattern += `[${char}\\u${begin.toString(16).padStart(4, '0')}-\\u${end.toString(16).padStart(4, '0')}]`;
                } else {
                    // 일반 글자나 완성된 한글일 경우 정규식 특수기호 이스케이프 처리 후 그대로 매칭
                    pattern += char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
				}

				// 글자와 글자 사이에 띄어쓰기가 있어도 매칭되도록 허용 (예: 'ㅂㅅ' -> '불 속성')
				pattern += '\\s*';
				}
				return new RegExp(pattern, 'i');
				}

				async function init() {
				try {
				const res = await fetch('FilteredDB.json');
				if (!res.ok) throw new Error(`데이터 파일 로드 실패: ${res.status}`);

				db = await res.json();

				// 태그 목록 추출
				const tagSet = new Set();
				Object.values(db.Characters).forEach(c => {
				Object.values(c.skills).forEach(s => s.tags.forEach(t => tagSet.add(t)));
				Object.values(c.potentials).forEach(p => p.tags.forEach(t => tagSet.add(t)));
				});
				Object.values(db.Records).forEach(r => {
				r.main_skill.forEach(t => tagSet.add(t));
				Object.values(r.sub_skills).forEach(tags => tags.forEach(t => tagSet.add(t)));
				});

				allUniqueTags = Array.from(tagSet).sort((a, b) => a.localeCompare(b, 'ko'));

				setupSearch();
				filterAndRender();
				} catch(e) {
				console.error("초기화 에러:", e);
				}
				}

				// 초성 검색 정규식 생성기
				function makeChosungRegex(searchQuery) {
				const CHOSUNG = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
				const HANGUL_START = 44032;
				let pattern = '';
				for (let i = 0; i < searchQuery.length; i++) {
            let char = searchQuery[i];
            let chosungIndex = CHOSUNG.indexOf(char);
            if (chosungIndex > -1) {
                let begin = HANGUL_START + (chosungIndex * 588);
                let end = begin + 587;
                pattern += `[${char}\\u${begin.toString(16).padStart(4, '0')}-\\u${end.toString(16).padStart(4, '0')}]`;
            } else {
                pattern += char.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
				}
				pattern += '\\s*';
				}
				return new RegExp(pattern, 'i');
				}

				function setupSearch() {
				const input = document.getElementById('tag-input');
				const suggestionBox = document.getElementById('tag-suggestions');

				input.onfocus = () => {
				const filtered = allUniqueTags.filter(t => !selectedTags.has(t));
				renderSuggestions(filtered);
				};
				input.oninput = (e) => {
				const val = e.target.value.trim();
				if(!val) return;
				const regex = makeChosungRegex(val);
				const filtered = allUniqueTags.filter(t => !selectedTags.has(t) && regex.test(t));
				renderSuggestions(filtered);
				};

				function renderSuggestions(list) {
				if(list.length > 0) {
				suggestionBox.innerHTML = list.map(t =>
				`<li class="px-5 py-3 hover:bg-indigo-50 cursor-pointer border-b border-slate-50" onmousedown="addTag('${t}')">${t}</li>`
				).join('');
				suggestionBox.classList.remove('hidden');
				} else {
				suggestionBox.classList.add('hidden');
				}
				}

				document.addEventListener('mousedown', (e) => {
				if(!e.target.closest('#tag-input') && !e.target.closest('#tag-suggestions')) {
				suggestionBox.classList.add('hidden');
				}
				});
				}

				function addTag(tag) {
				selectedTags.add(tag);
				document.getElementById('tag-input').value = '';
				renderSelectedTags();
				filterAndRender();
				}

				function removeTag(tag) {
				selectedTags.delete(tag);
				renderSelectedTags();
				filterAndRender();
				}

				function renderSelectedTags() {
				const container = document.getElementById('selected-tags-container');
				if(selectedTags.size === 0) {
				container.innerHTML = '<span class="text-slate-400 italic text-sm">선택된 태그가 없습니다.</span>';
				return;
				}
				container.innerHTML = Array.from(selectedTags).map(t =>
				`<span class="selected-tag" onclick="removeTag('${t}')">
					${t} <span>&times;</span>
				</span>`
				).join('');
				}

				function resetFilters() {
				selectedTags.clear();
				renderSelectedTags();
				filterAndRender();
				}

				function filterAndRender() {
				const charContainer = document.getElementById('character-list');
				const recContainer = document.getElementById('record-list');
				const selectedArr = Array.from(selectedTags);

				let charHtml = '', charCount = 0;
				Object.entries(db.Characters).forEach(([id, data]) => {
				let matches = [];
				Object.values(data.skills).forEach(s => { if(selectedArr.every(t => s.tags.includes(t))) matches.push({type:'스킬', name:s.Name, tags:s.tags}); });
				Object.values(data.potentials).forEach(p => { if(selectedArr.every(t => p.tags.includes(t))) matches.push({type:'잠재력', name:p.Name, tags:p.tags}); });

				if(matches.length > 0 || selectedTags.size === 0) {
				charCount++;
				charHtml += `<div class="char-item">
					<button class="toggle-btn" onclick="toggleDetail(this)">
						<span>${data.Name}</span>
					</button>
					<div class="detail-panel bg-white p-4 border-x border-b border-slate-100 rounded-b-xl space-y-2 mt-[-5px]">
						${matches.map(m => `<div class="p-2 bg-indigo-50 rounded text-sm">
							<strong>${m.name}</strong>
							<div class="flex flex-wrap gap-1 mt-1">
								${m.tags.map(t => `<span class="bg-white border px-1 rounded">${t}</span>`).join('')}
							</div>
						</div>`).join('')}
					</div>
				</div>`;
				}
				});

				let recHtml = '', recCount = 0;
				Object.entries(db.Records).forEach(([id, data]) => {
				let matches = [];
				if(selectedArr.every(t => data.main_skill.includes(t))) matches.push({type:'메인', tags:data.main_skill});
				Object.entries(data.sub_skills).forEach(([idx, item]) => { if(selectedArr.every(t => item.tags.includes(t))) matches.push({type:`보조 ${idx}`, tags:item.tags}); });

				if(matches.length > 0 || selectedTags.size === 0) {
				recCount++;
				recHtml += `<div class="rec-item">
					<button class="toggle-btn" onclick="toggleDetail(this)">
						<span>${data.Name}</span>
					</button>
					<div class="detail-panel bg-white p-4 border-x border-b border-slate-100 rounded-b-xl space-y-2 mt-[-5px]">
						${matches.map(m => `<div class="p-2 bg-emerald-50 rounded text-sm">
							<strong>${m.type}</strong>
							<div class="flex flex-wrap gap-1 mt-1">
								${m.tags.map(t => `<span class="bg-white border px-1 rounded">${t}</span>`).join('')}
							</div>
						</div>`).join('')}
					</div>
				</div>`;
				}
				});

				charContainer.innerHTML = charHtml;
				recContainer.innerHTML = recHtml;
				document.getElementById('char-count').innerText = charCount;
				document.getElementById('rec-count').innerText = recCount;
				}

				function toggleDetail(el) {
				el.classList.toggle('active');
				el.nextElementSibling.classList.toggle('active');
				}

				init();
			</script>
	</body>
</html>
